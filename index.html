:root{
  --bg:#0a0a14; --panel:#0d0e1e; --line:#2a2d55;
  --blue:#0a20b7; --blue2:#2338e6; --cream:#f5efda;
  --green:#1fe85a; --red:#ff2d55; --gold:#f5b82e;
  --ink:#e9ecff; --mute:#8a90bd; --bad:#ff5a6e;
}
*{box-sizing:border-box;margin:0;padding:0}
button,input,a{font-family:inherit}
button,input{border-radius:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'DM Mono',ui-monospace,Menlo,monospace;font-size:14px;line-height:1.65;
  min-height:100dvh;overflow-x:hidden;
}
body::after{                                   /* faint scanlines, like the monitor in the artwork */
  content:'';position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
}
a{color:inherit}
.wrap{max-width:460px;margin:0 auto;padding:16px 18px calc(36px + env(safe-area-inset-bottom))}
.sf{font-family:'Silkscreen',monospace;font-weight:700;text-transform:uppercase;letter-spacing:.06em}

.top{display:flex;justify-content:space-between;align-items:center;font-family:'Silkscreen',monospace;font-weight:700;font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.chip{font-family:'Silkscreen',monospace;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:1px 10px 0;border:3px solid currentColor}
.chip.off{color:var(--red);text-shadow:0 0 8px rgba(255,45,85,.55)}
.chip.on{color:var(--green);text-shadow:0 0 8px rgba(31,232,90,.55)}

/* ---------- the character ---------- */
.hero{position:relative;margin:16px 6px 26px 0;border:3px solid var(--cream);background:#000;box-shadow:8px 8px 0 var(--blue)}
.hero img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;image-rendering:pixelated}
.hero img.swap{animation:glitch .32s steps(3) 1}
.hero.hop{animation:hop .45s steps(4) 1}
@keyframes glitch{0%{transform:translateX(-8px);filter:brightness(1.8) hue-rotate(40deg)}33%{transform:translateX(6px);filter:brightness(1.3)}66%{transform:translateX(-3px)}100%{transform:none;filter:none}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-14px)}70%{transform:translateY(-4px)}100%{transform:none}}
.tape{                                          /* the ONLINE / OFFLINE banner from the artwork */
  position:absolute;left:0;right:0;bottom:12px;text-align:center;
  font-family:'Silkscreen',monospace;font-weight:700;font-size:26px;letter-spacing:.16em;
  color:var(--red);text-shadow:0 0 12px currentColor;pointer-events:none;
}
.tape.on{color:var(--green)}
.tape::before,.tape::after{content:'';display:block;height:6px;margin:5px 0;background:repeating-linear-gradient(90deg,currentColor 0 22px,transparent 22px 30px)}
.hero.reel .tape{display:none}

/* ---------- windows (the "copying" window from the artwork) ---------- */
.win{border:3px solid var(--cream);background:var(--panel);box-shadow:8px 8px 0 var(--blue);margin:0 8px 28px 0}
.win>.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--blue);color:var(--cream);padding:6px 10px;font-family:'Silkscreen',monospace;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.win>.bar .x{flex:none;width:20px;height:20px;border:2px solid var(--cream);display:grid;place-items:center;font-size:13px;line-height:1}
.win>.body{padding:16px}
.win.done>.bar{background:#0b7a35}
.prog{display:flex;gap:3px;border:3px solid var(--cream);padding:3px;height:28px}
.prog i{flex:1;background:transparent;transition:background .05s}
.prog i.on{background:var(--cream)}
.prog.green i.on{background:var(--green)}

/* ---------- buttons and fields ---------- */
.btn{
  font-family:'Silkscreen',monospace;font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;
  color:#031208;background:var(--green);border:3px solid var(--cream);padding:9px 16px;cursor:pointer;
  box-shadow:4px 4px 0 #000;transition:transform .08s,box-shadow .08s;white-space:nowrap;touch-action:manipulation;
}
.btn:hover:not(:disabled),.btn:focus-visible{transform:translate(-1px,-1px);box-shadow:5px 5px 0 #000;outline:none}
.btn:active:not(:disabled){transform:translate(4px,4px);box-shadow:0 0 0 #000}
.btn:disabled{background:#161933;color:#5d6396;border-color:#38407a;box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--cream)}
.btn.ghost:hover:not(:disabled){background:var(--cream);color:#05060f}
.btn.block{width:100%}
.fieldw{display:flex;align-items:baseline;gap:6px;border:3px solid var(--cream);background:#05060f;padding:0 10px}
.fieldw:focus-within{border-color:var(--green)}
.fieldw .at{color:var(--green);font-weight:500}
.in{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--ink);font-size:16px;padding:11px 2px}
.in::placeholder{color:#4b5086}
.err{min-height:20px;margin-top:8px;font-size:13px;color:var(--bad)}
.again{background:none;border:none;color:var(--mute);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:2px 0}
.again:hover{color:var(--ink)}

.foot{margin-top:6px;text-align:center;font-size:12px;color:var(--mute);line-height:1.8}
.foot a{color:var(--ink);text-underline-offset:3px}
.honey{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion:reduce){.hero.hop,.hero img.swap{animation:none}}


.kicker{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:0 8px 8px 0;font-family:'Silkscreen',monospace;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.kicker b{color:var(--green);font-weight:700}
.say{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(28px,8.6vw,38px);line-height:1.08;text-transform:uppercase;letter-spacing:.02em;margin:0 8px 22px 0}

.gl{font-family:'Silkscreen',monospace;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.gv{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(32px,10vw,46px);line-height:1.05;color:var(--green);text-shadow:0 0 16px rgba(31,232,90,.4);margin:4px 0 2px}
.gsym{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(20px,6vw,26px);color:var(--cream);line-height:1.1;margin-bottom:14px}
#cbar{margin:0 0 12px}
.gs{font-size:13px;line-height:1.55;color:var(--mute)}

.lede{margin:0 8px 0 0}
.lede p{color:#b9bedf;margin-bottom:14px}
.lede p b{color:var(--ink);font-weight:500}
.lede p.lead{color:var(--ink)}
.token{margin:6px 8px 4px 0;color:var(--mute);font-size:13px}
.token .tk{font-family:'Silkscreen',monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.token .tn{color:var(--ink);font-size:14px;margin-top:2px}
.mint{display:flex;gap:10px;align-items:center;margin-top:6px}
.mint code{font-family:inherit;font-size:12px;word-break:break-all;color:var(--ink);flex:1}
.mint button{font-family:'Silkscreen',monospace;font-weight:700;font-size:13px;color:var(--cream);background:none;border:2px solid var(--cream);padding:2px 10px;cursor:pointer}
.mint button:hover{background:var(--cream);color:#05060f}

.lockrow{display:flex;gap:16px;align-items:center;margin:20px 8px 28px 0;padding:14px 0;border-top:3px dashed var(--line);border-bottom:3px dashed var(--line)}
.lockrow svg{flex:none;width:36px;height:40px}
.lk{font-family:'Silkscreen',monospace;font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.ld{color:var(--ink);font-size:14px;margin-top:2px}
.cd{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(20px,6vw,26px);color:var(--gold);margin-top:4px}

.reserved{margin:0 8px 30px 0;padding:16px 18px;border:3px solid var(--green);box-shadow:8px 8px 0 #0b7a35;background:var(--panel)}
.rv{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(20px,6vw,26px);text-transform:uppercase;color:var(--green);line-height:1.1}
.rw{margin-top:8px;color:var(--ink)}
.rw span{color:var(--mute)}
.rn{margin-top:8px;color:var(--mute);font-size:13px}
.rn a{color:var(--gold)}

.steps{list-style:none;margin:0 8px 0 0}
.step{display:grid;grid-template-columns:40px 1fr auto;gap:4px 14px;align-items:start;padding:16px 0;border-bottom:3px dashed var(--line)}
.num{width:34px;height:34px;border:3px solid var(--mute);color:var(--mute);display:grid;place-items:center;font-family:'Silkscreen',monospace;font-weight:700;font-size:15px}
.step.active .num{border-color:var(--green);color:var(--green)}
.step.done .num{background:var(--green);border-color:var(--green);color:#031208}
.t{font-family:'Silkscreen',monospace;font-weight:700;font-size:clamp(15px,4.4vw,18px);line-height:1.25;text-transform:uppercase;letter-spacing:.03em;margin-top:4px}
.s{color:var(--mute);font-size:13px;margin-top:4px;line-height:1.5}
.step.done .t{color:var(--mute)}
.act{padding-top:2px}
.ok{font-family:'Silkscreen',monospace;font-weight:700;font-size:22px;color:var(--green)}
.step .btn{font-size:15px;padding:6px 12px}
.inline{grid-column:2 / 4;margin-top:6px}
.again{grid-column:2 / 4;justify-self:start}
.more{list-style:none;padding:16px 0 4px;text-align:center;color:var(--mute);font-size:13px}
.step.enter{animation:rise .38s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.step.enter{animation:none}}

</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <span id="brand"></span>
    <span class="chip off" id="net">offline</span>
  </header>

  <div class="hero cap" id="herobox"><img id="hero" alt="A hooded, faceless pixel-art character"><div class="tape off" id="tape">OFFLINE</div></div>

  <p class="kicker"><span>codersrh / airdrop claim</span><span id="tag"></span></p>
  <h1 class="say" id="say">claim your airdrop</h1>

  <section class="win" id="gift" aria-live="polite">
    <div class="bar"><span>AIRDROP.EXE</span><span class="x">x</span></div>
    <div class="body">
      <div class="gl">your airdrop</div>
      <div class="gv" id="gv"></div>
      <div class="gsym" id="gsym"></div>
      <div class="prog green" id="cbar" aria-hidden="true"></div>
      <div class="gs" id="gs"></div>
    </div>
  </section>

  <div class="lede" id="lede"></div>

  <div class="token" id="token"></div>

  <div class="lockrow" id="lockrow">
    <svg viewBox="0 0 9 10" shape-rendering="crispEdges" aria-hidden="true" id="lockicon"></svg>
    <div>
      <div class="lk">airdrop date</div>
      <div class="ld" id="ld"></div>
      <div class="cd" id="cd"></div>
    </div>
  </div>

  <div id="reserved"></div>

  <ol class="steps" id="steps"></ol>

  <div class="honey" aria-hidden="true"><input type="text" id="website" tabindex="-1" autocomplete="off"></div>

  <footer class="foot">
    <a id="xlink" href="#" target="_blank" rel="noopener"></a>
  </footer>
</div>

<script>
/* =========================================================
   CONFIG
   ========================================================= */
const CONFIG = {
  brand:      "codersrh",
  xHandle:    "codersrh",
  latestPost: "https://x.com/codersrh",   // replace with the pinned post URL (…/status/123456)

  // "evm" (0x… addresses, Robinhood Chain) · "sol" (Solana) · "any"
  chain: "evm",
  chainName: "Robinhood Chain",

  // The airdrop: the same amount for every person.
  airdrop: { amount: 200000, symbol: "CODERS" },

  // The token's contract address on Robinhood Chain. Paste it once the token exists and the page will show it
  // (with a copy button) so people can check they are looking at the right token.
  // Leave EMPTY until then: the page says the address will be announced on X.
  mint: "",


  // When the list closes and the airdrop is sent. ISO format, with a timezone:
  // "2026-10-08T00:00:00Z". Leave EMPTY until the date is decided; the page then says
  // "announced on X" instead of showing a countdown.
  revealAt: "",

  // Same Google Form as the main page (2 short-answer questions: X username, wallet address)
  form: {
    action: "https://docs.google.com/forms/d/e/FORM_ID_HERE/formResponse",
    handle: "entry.111111111",
    wallet: "entry.222222222",
  },
};
/* ======================================================= */

const $ = id => document.getElementById(id);
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const X = CONFIG.xHandle;

$("brand").textContent = CONFIG.brand;
$("xlink").href = "https://x.com/" + X;
$("xlink").textContent = "@" + X;

const REVEAL = CONFIG.revealAt ? new Date(CONFIG.revealAt).getTime() : NaN;
const hasDate = Number.isFinite(REVEAL);

/* ---------------------------------------------------------
   state: the same key as the main page, so progress carries over
   --------------------------------------------------------- */
const KEY = "claudesfun_v1";
let S = { handle:"", follow:false, like:false, rt:false, comment:false, bell:false, wallet:false, short:"", opened:{} };
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch(e){}
if (!S.opened) S.opened = {};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

const ROWS = [
  { k:"handle",  title:"Your X handle",           sub:"so we know who the airdrop is for",       btn:"Save" },
  { k:"follow",  title:"Follow @" + X,            sub:"so we can reach you when the list opens", btn:"Follow" },
  { k:"like",    title:"Like the latest post",    sub:"one like on our latest post",             btn:"Like" },
  { k:"rt",      title:"Repost the latest post",  sub:"one repost, that's it",                   btn:"Repost" },
  { k:"comment", title:"Comment on the latest post", sub:"leave a reply under it, any reply counts", btn:"Comment" },
  { k:"bell",    title:"Turn on notifications",   sub:"tap the bell on our profile",             btn:"Bell" },
  { k:"wallet",  title:"Your Robinhood Chain wallet",      sub:"where the airdrop is sent",               btn:"Claim" },
];
const isDone = k => k === "handle" ? !!S.handle : !!S[k];
const doneCount = () => ROWS.filter(r => isDone(r.k)).length;
const current = () => ROWS.findIndex(r => !isDone(r.k));
const progress = () => doneCount() / ROWS.length;

function moodNow(){
  const n = doneCount();
  if (n === ROWS.length) return "happy";
  if (n === ROWS.length - 1) return "ready";
  if (n >= 2) return "awake";
  return n === 1 ? "sleepy" : "sleep";
}

/* ---------------------------------------------------------
   validation + sending
   --------------------------------------------------------- */
const HAND = /^@?[A-Za-z0-9_]{1,15}$/, EVM = /^0x[a-fA-F0-9]{40}$/, B58RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
const B58 = "123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz";
function b58bytes(s){
  let n = 0n;
  for (const ch of s){ const i = B58.indexOf(ch); if (i < 0) return -1; n = n * 58n + BigInt(i); }
  let lead = 0; for (const ch of s){ if (ch === "1") lead++; else break; }
  let hex = n.toString(16); if (hex.length % 2) hex = "0" + hex;
  return (n === 0n ? 0 : hex.length / 2) + lead;
}
const SOL = { test: v => B58RE.test(v) && b58bytes(v) === 32 };
const walletOk = v => CONFIG.chain === "evm" ? EVM.test(v) : CONFIG.chain === "sol" ? SOL.test(v) : (EVM.test(v) || SOL.test(v));
const WALLET_LABEL = { evm:"robinhood chain wallet (0x…)", sol:"solana wallet address", any:"wallet address" }[CONFIG.chain];

function postViaIframe(fields){
  return new Promise(resolve => {
    const name = "gf_" + Date.now();
    const fr_ = document.createElement("iframe"); fr_.name = name; fr_.style.display = "none";
    const fm = document.createElement("form"); fm.action = CONFIG.form.action; fm.method = "POST"; fm.target = name; fm.style.display = "none";
    Object.entries(fields).forEach(([k, v]) => { const i = document.createElement("input"); i.type = "hidden"; i.name = k; i.value = v; fm.appendChild(i); });
    document.body.append(fr_, fm);
    let done = false;
    const fin = () => { if (done) return; done = true; setTimeout(() => { fm.remove(); fr_.remove(); }, 1000); resolve(); };
    fr_.addEventListener("load", fin); setTimeout(fin, 3000);
    fm.submit();
  });
}
async function send(fields){
  const body = new FormData();
  Object.entries(fields).forEach(([k, v]) => body.append(k, v));
  try { await fetch(CONFIG.form.action, { method:"POST", mode:"no-cors", body }); }
  catch(e){ await postViaIframe(fields); }
}

const tweetId = () => { const m = CONFIG.latestPost.match(/status\/(\d+)/); return m ? m[1] : ""; };
function taskUrl(k){
  if (k === "follow") return "https://x.com/intent/follow?screen_name=" + X;
  const id = tweetId();
  if (id && k === "like") return "https://x.com/intent/like?tweet_id=" + id;
  if (id && k === "rt")   return "https://x.com/intent/retweet?tweet_id=" + id;
  if (id && k === "comment") return "https://x.com/intent/tweet?in_reply_to=" + id;
  if (k === "bell") return "https://x.com/" + X;
  return CONFIG.latestPost;
}

/* ---------------------------------------------------------
   the airdrop: one fixed amount for everyone
   --------------------------------------------------------- */
function paintGift(){
  const a = CONFIG.airdrop;
  $("gv").textContent = a.amount.toLocaleString("en-US");
  $("gsym").textContent = "$" + a.symbol + " per person";
  $("cbar").innerHTML = ROWS.map((_, i) => '<i class="' + (i < doneCount() ? "on" : "") + '"></i>').join("");
  $("gs").textContent = S.wallet
    ? "claim registered. sent to " + (S.short || "your wallet") + " when the list closes."
    : "sent to your wallet once you finish the steps and the list closes.";
  $("gift").classList.toggle("done", !!S.wallet);
}

/* ---------------------------------------------------------
   padlock (9 x 10 cells)
   --------------------------------------------------------- */
const LOCK = ["..#####..", ".##...##.", ".#.....#.", ".#.....#.", "#########", "#########", "####.####", "####.####", "#########", "#########"];
$("lockicon").innerHTML = LOCK.map((row, y) => [...row].map((c, x) => c === "#" ? '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="#1fe85a"/>' : "").join("")).join("");

const heroEl = document.getElementById("hero"), heroBox = document.getElementById("herobox"),
      tapeEl = document.getElementById("tape"), netEl = document.getElementById("net");
let heroKey = "";
function setNet(on){
  netEl.textContent = on ? "online" : "offline"; netEl.className = "chip " + (on ? "on" : "off");
  tapeEl.textContent = on ? "ONLINE" : "OFFLINE"; tapeEl.className = "tape " + (on ? "on" : "off");
}
function setHero(key, on){
  if (key !== heroKey){
    heroKey = key; heroEl.src = IMG[key]; heroBox.className = "hero " + key;
    heroEl.classList.remove("swap"); void heroEl.offsetWidth; heroEl.classList.add("swap");
  }
  setNet(on);
}
function bump(){ heroBox.classList.remove("hop"); void heroBox.offsetWidth; heroBox.classList.add("hop"); }

function paintHero(){
  const n = doneCount(), total = ROWS.length;
  if (n === total) setHero("king", true);
  else if (n >= 2) setHero("copying", true);
  else setHero("cap", n >= 1);
}
function sparkle(){}

/* ---------------------------------------------------------
   the page
   --------------------------------------------------------- */
const fmtDate = d => d.toLocaleString("en-US", { month:"long", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit", timeZoneName:"short" });

function paintLede(){
  const a = CONFIG.airdrop, amt = a.amount.toLocaleString("en-US");
  const dateLine = hasDate
    ? 'On <b>' + esc(fmtDate(new Date(REVEAL))) + '</b> the list closes and the airdrop is sent.'
    : 'The date the list closes and the airdrop is sent will be announced on <b>@' + esc(X) + '</b>.';
  $("lede").innerHTML =
    '<p class="lead">Every wallet that finishes the steps below gets <b>' + amt + ' $' + esc(a.symbol) + '</b>.</p>' +
    '<p>One airdrop per person. Duplicate and fake accounts are removed before anything is sent.</p>' +
    '<p>' + dateLine + '</p>' +
    '<p>Until then your airdrop is reserved. The wait lets us check accounts and line up the transfer.</p>';
  $("ld").textContent = hasDate ? fmtDate(new Date(REVEAL)) : "announced on @" + X;

  const mint = (CONFIG.mint || "").trim();
  $("token").innerHTML = '<div class="tk">token</div><div class="tn">$' + esc(a.symbol) + ' · ' + esc(CONFIG.chainName) + '</div>' +
    (mint
      ? '<div class="mint"><code>' + esc(mint) + '</code><button type="button" id="cpm">copy</button></div>'
      : '<div>token address will be announced on @' + esc(X) + '</div>');
  const cp = $("cpm");
  if (cp) cp.onclick = async () => {
    try { await navigator.clipboard.writeText(mint); cp.textContent = "copied"; } catch(e){ cp.textContent = "select it"; }
    setTimeout(() => cp.textContent = "copy", 1600);
  };
}

const pad = n => String(n).padStart(2, "0");
function tick(){
  if (!hasDate){ $("cd").textContent = ""; return; }
  const ms = REVEAL - Date.now();
  if (ms <= 0){ $("cd").textContent = "snapshot time reached"; return; }
  const s = Math.floor(ms / 1000);
  $("cd").textContent = pad(Math.floor(s / 86400)) + "d " + pad(Math.floor(s / 3600) % 24) + "h " + pad(Math.floor(s / 60) % 60) + "m " + pad(s % 60) + "s";
}

function paintTop(){
  const a = CONFIG.airdrop;
  $("tag").innerHTML = S.handle ? 'steps <b>' + doneCount() + '</b>/' + ROWS.length : "";
  $("reserved").innerHTML = S.wallet
    ? '<div class="reserved"><div class="rv">claim registered</div>' +
      '<div class="rw">' + a.amount.toLocaleString("en-US") + ' $' + esc(a.symbol) + ' <span>· @' + esc(S.handle) + ' · ' + esc(S.short || "") + '</span></div>' +
      '<div class="rn">The airdrop is sent to that wallet when the list closes. Keep notifications on for <a href="https://x.com/' + esc(X) + '" target="_blank" rel="noopener">@' + esc(X) + '</a>.</div></div>'
    : "";
}

let lastActive = "";
function renderSteps(){
  const cur = current();
  const animate = cur >= 0 && ROWS[cur].k !== lastActive;
  lastActive = cur >= 0 ? ROWS[cur].k : "";
  const rowsHtml = ROWS.map((r, i) => {
    const done = isDone(r.k), active = i === cur;
    if (!done && !active) return "";                          // later steps stay hidden until their turn
    const cls = done ? "done" : active ? "active" : "locked";
    const isTask = !["handle", "wallet"].includes(r.k);
    let sub = r.sub;
    if (done && r.k === "handle") sub = "@" + esc(S.handle);
    if (done && r.k === "wallet") sub = esc(S.short || "");

    let act;
    if (done) act = '<span class="ok">✓</span>';
    else if (active) act = '<button class="btn" type="button" data-go="' + r.k + '">' + (isTask && S.opened[r.k] ? "Done?" : r.btn) + '</button>';
    else act = '<button class="btn" type="button" disabled>' + r.btn + '</button>';

    let extra = "";
    if (active && r.k === "handle")
      extra = '<div class="inline"><label class="fieldw"><span class="at">@</span><input class="in" id="in" type="text" placeholder="your x handle" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="16"></label><p class="err" id="err"></p></div>';
    if (active && r.k === "wallet")
      extra = '<div class="inline"><label class="fieldw"><input class="in" id="in" type="text" placeholder="' + WALLET_LABEL + '" autocomplete="off" autocapitalize="off" spellcheck="false"></label><p class="err" id="err"></p></div>';
    if (active && isTask && S.opened[r.k])
      extra = '<button class="again" type="button" data-again="' + r.k + '">open X again ↗</button>';

    return '<li class="step ' + cls + (active && animate ? " enter" : "") + '"><span class="num">' + (done ? "✓" : i + 1) + '</span>' +
           '<div class="info"><div class="t">' + r.title + '</div><div class="s">' + sub + '</div></div>' +
           '<div class="act">' + act + '</div>' + extra + '</li>';
  }).join("");
  const left = cur >= 0 ? ROWS.length - 1 - cur : 0;
  $("steps").innerHTML = rowsHtml + (left > 0 ? '<li class="more">' + left + ' more step' + (left > 1 ? "s" : "") + ' unlock as you go</li>' : "");

  document.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll("[data-again]").forEach(b => b.onclick = () => window.open(taskUrl(b.dataset.again), "_blank", "noopener"));
  const inp = $("in");
  if (inp) inp.onkeydown = e => { if (e.key === "Enter") go(current() >= 0 ? ROWS[current()].k : ""); };
  if (inp) inp.oninput = () => { const er = $("err"); if (er) er.textContent = ""; };
}

function paintAll(){
  paintGift();
  paintTop();
  renderSteps();
  paintHero();
}

async function go(k){
  if (k === "handle"){
    const v = $("in").value.trim();
    if (!HAND.test(v)){ $("err").textContent = "that doesn't look like an x handle."; return; }
    S.handle = v.replace(/^@/, ""); save(); bump(); paintAll(); return;
  }
  if (k === "wallet"){
    if ($("website").value) return;
    const v = $("in").value.trim();
    if (!walletOk(v)){ $("err").textContent = CONFIG.chain === "evm" ? "that's not a valid 0x address on " + CONFIG.chainName + "." : "that's not a wallet address."; return; }
    const btn = document.querySelector('[data-go="wallet"]'); btn.disabled = true; btn.textContent = "…";
    await send({ [CONFIG.form.handle]: S.handle, [CONFIG.form.wallet]: v });
    S.wallet = true; S.short = v.slice(0, 6) + "…" + v.slice(-4); save(); bump(); sparkle(30); paintAll(); return;
  }
  if (!S.opened[k]){ window.open(taskUrl(k), "_blank", "noopener"); S.opened[k] = true; save(); renderSteps(); return; }
  S[k] = true; save(); bump(); paintAll();
}

/* ---------------------------------------------------------
   go
   --------------------------------------------------------- */
paintLede();
paintAll();
tick(); setInterval(tick, 1000);
</script>
